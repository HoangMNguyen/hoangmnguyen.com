AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Focus Bank sync backend: Cognito identity pool (anonymous guests with
  optional Google upgrade) + DynamoDB (one row per identity, enforced by IAM).
  Provisioned throughput is a hard cost cap; optional $5/month budget alert.

Parameters:
  GoogleClientId:
    Type: String
    Description: OAuth 2.0 Web client ID from Google Cloud Console (ends in .apps.googleusercontent.com)
  BudgetEmail:
    Type: String
    Default: ''
    Description: Email for the $5/month budget alert (leave blank to skip creating the budget)

Conditions:
  HasBudgetEmail: !Not [!Equals [!Ref BudgetEmail, '']]

Resources:

  # ---- Data store: one item per user, keyed by Cognito identity ID ----
  # PROVISIONED (not on-demand) is deliberate: 5 RCU / 5 WCU sits inside the
  # DynamoDB always-free tier AND acts as a physical throughput ceiling —
  # excess traffic is throttled, not billed.
  DataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: FocusBankData
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  # ---- Identity pool: guests allowed, Google as the upgrade provider ----
  IdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: FocusBankIdentities
      AllowUnauthenticatedIdentities: true
      SupportedLoginProviders:
        accounts.google.com: !Ref GoogleClientId

  # ---- Roles: guests and signed-in users get the SAME row-scoped access ----
  # The Condition on dynamodb:LeadingKeys means: you may only Get/Put items
  # whose partition key equals YOUR OWN Cognito identity id. Row-level
  # security enforced by IAM — no application server needed.
  UnauthenticatedRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: focusbank-guest-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Federated: cognito-identity.amazonaws.com }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref IdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: unauthenticated
      Policies:
        - PolicyName: own-row-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem]
                Resource: !GetAtt DataTable.Arn
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys:
                      - ${cognito-identity.amazonaws.com:sub}

  AuthenticatedRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: focusbank-user-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Federated: cognito-identity.amazonaws.com }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref IdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: authenticated
      Policies:
        - PolicyName: own-row-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem]
                Resource: !GetAtt DataTable.Arn
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys:
                      - ${cognito-identity.amazonaws.com:sub}

  RoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref IdentityPool
      Roles:
        unauthenticated: !GetAtt UnauthenticatedRole.Arn
        authenticated: !GetAtt AuthenticatedRole.Arn

  # ---- Safety net: email alerts as spend approaches $5/month ----
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetEmail
    Properties:
      Budget:
        BudgetName: focus-bank-monthly-cap
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: 5, Unit: USD }
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref BudgetEmail }
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref BudgetEmail }

Outputs:
  IdentityPoolId:
    Description: Paste into CFG.identityPoolId in the app
    Value: !Ref IdentityPool
  Region:
    Description: Paste into CFG.region in the app
    Value: !Ref AWS::Region
  TableName:
    Description: Paste into CFG.table in the app
    Value: !Ref DataTable
